<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="心跳艺术 — 把心率 CSV 变成会呼吸的动态视觉作品" />
    <title>心跳艺术 · Heartbeat Art</title>
    <link rel="stylesheet" href="/styles/main.css" />
  </head>
  <body data-style="neon">
    <canvas id="stage" aria-label="心跳数据动态可视化画布"></canvas>

    <!-- 拖拽上传遮罩 -->
    <div id="dropzone" class="dropzone" aria-hidden="true">
      <div class="dropzone-inner">
        <svg viewBox="0 0 24 24" width="30" height="30" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V4M12 4l-4 4M12 4l4 4"/><path d="M4 16v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/></svg>
        <span>松开以载入 CSV 心跳数据</span>
      </div>
    </div>

    <!-- 中央引导 -->
    <div id="hint" class="center-hint">
      <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12h4l2-6 4 12 3-8 2 2h5"/></svg>
      <p>上传 CSV，或直接欣赏内置示例心率</p>
    </div>

    <!-- 左上角：品牌 + 上传 -->
    <header class="panel panel-tl">
      <div class="brand">
        <svg class="brand-mark" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12h4l2-6 4 12 3-8 2 2h5"/></svg>
        <div class="brand-text">
          <span class="brand-title">心跳艺术</span>
          <span class="brand-sub">HEARTBEAT ART</span>
        </div>
      </div>
      <div class="actions">
        <button id="uploadBtn" class="btn btn-primary" aria-label="上传 CSV 心跳数据文件">
          <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V4M12 4l-4 4M12 4l4 4"/><path d="M4 16v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/></svg>
          <span>上传 CSV</span>
        </button>
        <button id="demoBtn" class="btn btn-ghost" aria-label="载入内置示例心率数据">示例数据</button>
        <input id="fileInput" type="file" accept=".csv,text/csv" hidden />
      </div>
      <p id="fileStatus" class="status-line" role="status" aria-live="polite"></p>
      <p id="errorLine" class="error-line" role="alert"></p>
    </header>

    <!-- 右上角：风格 + 参数 -->
    <aside class="panel panel-tr">
      <div class="style-switch" role="tablist" aria-label="艺术风格切换">
        <button class="seg is-active" data-style-key="neon" role="tab" aria-selected="true">霓虹</button>
        <button class="seg" data-style-key="watercolor" role="tab" aria-selected="false">水彩</button>
        <button class="seg" data-style-key="mono" role="tab" aria-selected="false">极简</button>
      </div>

      <div id="paramsPanel" class="params">
        <div class="param-row">
          <label for="countRange">粒子数量</label>
          <div class="range-wrap">
            <input id="countRange" type="range" min="100" max="2000" step="50" value="900" aria-valuenow="900" />
            <span id="countVal" class="val">900</span>
          </div>
        </div>
        <div class="param-row">
          <label for="speedRange">运动速度</label>
          <div class="range-wrap">
            <input id="speedRange" type="range" min="0.25" max="3" step="0.05" value="1" aria-valuenow="1" />
            <span id="speedVal" class="val">1.00×</span>
          </div>
        </div>
        <div class="param-row param-row-column">
          <label>颜色主题</label>
          <div id="paletteRow" class="palette-row" role="radiogroup" aria-label="颜色主题"></div>
        </div>
        <label class="toggle-row">
          <input id="motionToggle" type="checkbox" />
          <span>减弱动态（跟随系统）</span>
        </label>
      </div>

      <button id="panelToggle" class="panel-toggle" aria-label="折叠或展开参数面板" aria-expanded="true">
        <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M7 12h10M10 17h4"/></svg>
        <span>参数</span>
      </button>
    </aside>

    <!-- 左下角：状态 -->
    <footer class="hud hud-bl">
      <span id="fpsVal">-- fps</span>
      <span class="dot">·</span>
      <span id="hudCount">900 粒子</span>
      <span class="dot">·</span>
      <span id="hudBpm">-- bpm</span>
    </footer>

    <!-- 底部居中：保存 -->
    <div class="hud hud-bottom">
      <button id="saveBtn" class="btn btn-primary" aria-label="保存当前画面为 PNG 图片">
        <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11M12 15l-4-4M12 15l4-4"/><path d="M4 17v1a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-1"/></svg>
        <span>保存为 PNG</span>
      </button>
    </div>

    <script src="/scripts/app.js" defer></script>
  </body>
</html>
